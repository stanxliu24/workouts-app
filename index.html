// ============================================================
// Render dispatcher
// ============================================================
function render(){
  const root = document.getElementById("app");
  const v = State.view;
  let html = "";
  switch (v.name){
    case "library": html = renderLibrary(); break;
    case "today": html = renderToday(); break;
    case "exercise": html = renderExercise(v.idx); break;
    case "week": html = renderWeek(v.week); break;
    case "history": html = renderHistory(v.monthOffset||0); break;
    case "session": html = renderSession(v.id); break;
    case "progress": html = renderProgress(v.name); break;
    case "program": html = renderProgramDetail(v.id); break;
    case "day": html = renderDayView(v.week, v.dayIndex); break;
    default: html = renderToday();
  }
  root.innerHTML = html;
  // Restart timer interval if needed
  if (State.activeSession && State.activeSession.restEndsAt && Date.now() < State.activeSession.restEndsAt && !State.restTimerInterval){
    startRestTimer();
  }
}
function navigate(view){ State.view = view; render(); }

// ============================================================
// Event handling (delegated)
// ============================================================
function esc(s){
  if (s == null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("on"), 2000);
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const a = t.dataset.action;

  if (a === "nav"){ navigate({ name: t.dataset.view }); return; }
  if (a === "toggle-units"){ State.units = State.units === "lb" ? "kg" : "lb"; await State.saveState(); render(); return; }

  // Library
  if (a === "open-program"){ navigate({ name: "program", id: t.dataset.id }); return; }
  if (a === "make-active"){
    const p = State.programs.find(x => x.id === t.dataset.id);
    if (p){
      // Set old active to paused
      const old = State.activeProgram();
      if (old){ old.status = "paused"; old.updatedAt = new Date().toISOString(); await dbPut("programs", old); }
      p.status = "active"; p.updatedAt = new Date().toISOString();
      if (!p.startDate) p.startDate = todayISO();
      State.activeProgramId = p.id;
      await dbPut("programs", p);
      await State.saveState();
      showToast(`${p.name} is now active`);
      navigate({ name: "today" });
    }
    return;
  }
  if (a === "import-program"){ document.getElementById("filepicker").click(); return; }
  if (a === "delete-program"){
    if (!confirm("Delete this program and all its sessions?")) return;
    const id = t.dataset.id;
    await dbDel("programs", id);
    State.programs = State.programs.filter(p => p.id !== id);
    if (State.activeProgramId === id){ State.activeProgramId = null; State.activeSession = null; }
    // Cascade: delete sessions and setLogs of this program
    const sessIds = State.sessions.filter(s => s.programId === id).map(s => s.id);
    for (const sid of sessIds){ await dbDel("sessions", sid); }
    State.sessions = State.sessions.filter(s => s.programId !== id);
    const lids = State.setLogs.filter(l => sessIds.includes(l.sessionId)).map(l => l.id);
    for (const lid of lids){ await dbDel("setLogs", lid); }
    State.setLogs = State.setLogs.filter(l => !sessIds.includes(l.sessionId));
    await State.saveState();
    showToast("Program deleted");
    navigate({ name: "library" });
    return;
  }
  if (a === "restart-cycle"){
    if (!confirm("Restart this program from week 1?")) return;
    const p = State.programs.find(x => x.id === t.dataset.id);
    if (p){
      p.cursor = { week: 1, dayIndex: 0 };
      p.startDate = todayISO();
      p.status = "active"; State.activeProgramId = p.id; State.activeSession = null;
      await dbPut("programs", p); await State.saveState();
      showToast("Cycle restarted"); navigate({ name: "today" });
    }
    return;
  }

  // Today / Exercise
  if (a === "open-exercise"){
    navigate({ name: "exercise", idx: parseInt(t.dataset.idx) });
    return;
  }
  if (a === "open-week"){ navigate({ name: "week", week: parseInt(t.dataset.week) }); return; }
  if (a === "open-progress"){ navigate({ name: "progress", name: t.dataset.name }); return; }
  if (a === "back-to-exercise"){
    if (State.activeSession?.currentExerciseIndex != null){ navigate({ name: "exercise", idx: State.activeSession.currentExerciseIndex }); }
    else { navigate({ name: "today" }); }
    return;
  }
  if (a === "log-set"){
    const idx = parseInt(t.dataset.idx);
    const exercises = State.exercisesForToday();
    const ex = exercises[idx];
    const sets = expandSets(ex);
    const sIdx = State.activeSession?.completed?.[idx] || 0;
    if (sIdx >= sets.length) return;
    const wEl = document.getElementById("cur-weight");
    const rEl = document.getElementById("cur-reps");
    const w = parseFloat(wEl?.textContent) || 0;
    const r = parseInt(rEl?.textContent) || 0;
    if (!r){ showToast("Enter reps"); return; }
    logSet(idx, sIdx, ex, sets[sIdx], { weight: w, reps: r });
    render();
    return;
  }
  if (a === "step"){
    const id = t.dataset.target.split("-")[0];
    const elId = id === "weight" ? "cur-weight" : "cur-reps";
    const el = document.getElementById(elId);
    const cur = parseFloat(el.textContent) || 0;
    const by = parseFloat(t.dataset.by);
    const next = Math.max(0, cur + by);
    el.textContent = id === "weight" ? (next % 1 === 0 ? next : next.toFixed(1)) : Math.round(next);
    return;
  }
  if (a === "mark-all-done"){
    const idx = parseInt(t.dataset.idx);
    if (!confirm("Log all remaining sets at the prescribed weight?")) return;
    const ex = State.exercisesForToday()[idx];
    const sets = expandSets(ex);
    const p = State.activeProgram();
    const startFrom = State.activeSession?.completed?.[idx] || 0;
    for (let i = startFrom; i < sets.length; i++){
      const s = sets[i];
      const w = computeIntensityWeight(s.intensity, ex.name, p);
      const wDisp = w ? roundDisplay(convertWeight(w.value, w.units, State.units), State.units) : 0;
      const reps = Number.isFinite(s.reps) ? s.reps : (parseInt(s.reps) || 1);
      logSet(idx, i, ex, s, { weight: wDisp, reps, markedAllDone: true });
    }
    State.activeSession.restEndsAt = null;
    if (State.restTimerInterval){ clearInterval(State.restTimerInterval); State.restTimerInterval = null; }
    showToast(`${ex.name} complete`);
    navigate({ name: "today" });
    return;
  }
  if (a === "rest-skip"){
    if (State.activeSession){ State.activeSession.restEndsAt = null; State.saveState(); }
    if (State.restTimerInterval){ clearInterval(State.restTimerInterval); State.restTimerInterval = null; }
    render();
    return;
  }
  if (a === "rest-add"){
    if (State.activeSession?.restEndsAt){ State.activeSession.restEndsAt += 30000; }
    return;
  }
  if (a === "finish-session"){
    if (!State.activeSession){
      // Just advance day with no logged sets
      if (!confirm("Finish session with no sets logged? This won't be marked as a workout.")) return;
      const p = State.activeProgram();
      if (p){
        const wks = p.json.weeks;
        if (p.cursor.dayIndex < (wks[p.cursor.week-1]?.days?.length||0)-1) p.cursor.dayIndex++;
        else if (p.cursor.week < wks.length){ p.cursor.week++; p.cursor.dayIndex = 0; }
        else p.status = "completed";
        await dbPut("programs", p);
      }
      navigate({ name: "today" });
      return;
    }
    await finishSession("logged");
    showToast("Session saved");
    navigate({ name: "today" });
    return;
  }
  if (a === "edit-active-note"){
    editSessionNotePrompt();
    return;
  }
  if (a === "skip-session"){
    skipSession();
    return;
  }
  if (a === "add-exercise"){
    showAdHocExerciseModal();
    return;
  }
  if (a === "open-day-view"){
    const wk = parseInt(t.dataset.week);
    const di = parseInt(t.dataset.dayIndex);
    if (!Number.isFinite(wk) || !Number.isFinite(di)) return;
    const p = State.activeProgram();
    if (p && wk === p.cursor.week && di === p.cursor.dayIndex){
      navigate({ name: "today" });
    } else {
      navigate({ name: "day", week: wk, dayIndex: di });
    }
    return;
  }
  if (a === "step-day"){
    const p = State.activeProgram();
    if (!p) return;
    const by = parseInt(t.dataset.by);
    let w = p.cursor.week, di = p.cursor.dayIndex + by;
    if (di < 0){
      if (w <= 1) return;
      w--; di = (p.json.weeks[w-1].days.length || 1) - 1;
    } else if (di >= (p.json.weeks[w-1].days.length || 0)){
      if (w >= p.json.weeks.length) return;
      w++; di = 0;
    }
    navigate({ name: "day", week: w, dayIndex: di });
    return;
  }
  if (a === "exercise-done"){
    e.stopPropagation();
    const idx = parseInt(t.dataset.idx);
    const ex = State.exercisesForToday()[idx];
    const sets = expandSets(ex);
    const sess = ensureActiveSession();
    const startFrom = sess.completed?.[idx] || 0;
    if (startFrom >= sets.length) return; // already done
    if (!confirm(`Mark ${ex.name} fully done at the prescribed weight?`)) return;
    const p = State.activeProgram();
    for (let i = startFrom; i < sets.length; i++){
      const s = sets[i];
      const w = computeIntensityWeight(s.intensity, ex.name, p);
      const wDisp = w ? roundDisplay(convertWeight(w.value, w.units, State.units), State.units) : 0;
      const reps = Number.isFinite(s.reps) ? s.reps : (parseInt(s.reps) || 1);
      logSet(idx, i, ex, s, { weight: wDisp, reps, markedAllDone: true });
    }
    sess.restEndsAt = null;
    if (State.restTimerInterval){ clearInterval(State.restTimerInterval); State.restTimerInterval = null; }
    State.saveState();
    render();
    showToast(`${ex.name} done`);
    return;
  }
  if (a === "noop"){ return; }

  // Calendar
  if (a === "cal-month"){
    const cur = State.view.monthOffset || 0;
    State.view = { name: "history", monthOffset: cur + parseInt(t.dataset.by) };
    render();
    return;
  }
  if (a === "cal-select"){
    State._selDate = t.dataset.date;
    render();
    return;
  }
  if (a === "open-session"){ navigate({ name: "session", id: t.dataset.id }); return; }
  if (a === "delete-session"){
    if (!confirm("Delete this session?")) return;
    const id = t.dataset.id;
    await dbDel("sessions", id);
    State.sessions = State.sessions.filter(s => s.id !== id);
    const lids = State.setLogs.filter(l => l.sessionId === id).map(l => l.id);
    for (const lid of lids){ await dbDel("setLogs", lid); }
    State.setLogs = State.setLogs.filter(l => l.sessionId !== id);
    showToast("Session deleted");
    navigate({ name: "history" });
    return;
  }
  if (a === "edit-session-notes"){
    const id = t.dataset.id;
    const s = State.sessions.find(x => x.id === id);
    const cur = s?.notes || "";
    showInputModal("Session notes", cur, async (val) => {
      s.notes = val; await dbPut("sessions", s); render(); showToast("Notes saved");
    }, true);
    return;
  }
  if (a === "export-data"){
    const data = { programs: State.programs, sessions: State.sessions, setLogs: State.setLogs, units: State.units, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a2 = document.createElement("a");
    a2.href = url; a2.download = `workouts-export-${todayISO()}.json`;
    document.body.appendChild(a2); a2.click(); a2.remove();
    URL.revokeObjectURL(url);
    return;
  }
  if (a === "modal-close"){ closeModal(); return; }
});

// ORM input change
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.action === "orm-edit"){
    const program = State.programs.find(p => p.id === t.dataset.program);
    if (!program) return;
    const v = parseFloat(t.value);
    program.oneRepMax = program.oneRepMax || {};
    if (Number.isFinite(v) && v > 0){
      // Always store in the units the user is currently viewing
      program.oneRepMax[t.dataset.name] = { value: v, units: State.units };
    } else {
      delete program.oneRepMax[t.dataset.name];
    }
    program.updatedAt = new Date().toISOString();
    await dbPut("programs", program);
    showToast(`${t.dataset.name} 1RM ${Number.isFinite(v)?'set to '+v+' '+State.units:'cleared'}`);
    render();
  }
});

// File picker
document.getElementById("filepicker").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const json = JSON.parse(text);
    if (!validateProgram(json)){ showToast("Invalid program JSON"); return; }
    const id = uuid();
    const orm = {};
    if (json.one_rep_max){
      Object.entries(json.one_rep_max).forEach(([k,v]) => {
        orm[k] = { value: v, units: json.units_default || "lb" };
      });
    }
    const prog = {
      id, name: json.name || "Untitled", json,
      oneRepMax: orm,
      status: "paused",
      cursor: { week: 1, dayIndex: 0 },
      startDate: todayISO(),
      importedAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    await dbPut("programs", prog);
    State.programs.push(prog);
    if (confirm(`Imported "${prog.name}". Make it the active program?`)){
      const old = State.activeProgram();
      if (old){ old.status = "paused"; await dbPut("programs", old); }
      prog.status = "active"; State.activeProgramId = id;
      await dbPut("programs", prog);
      await State.saveState();
      navigate({ name: "today" });
    } else {
      render();
    }
  } catch (err){
    showToast("Could not parse JSON");
    console.error(err);
  } finally {
    e.target.value = "";
  }
});

function validateProgram(j){
  if (!j || typeof j !== "object") return false;
  if (!Array.isArray(j.weeks) || j.weeks.length === 0) return false;
  for (const w of j.weeks){
    if (!Array.isArray(w.days)) return false;
    for (const d of w.days){
      if (!Array.isArray(d.exercises)) return false;
    }
  }
  return true;
}

// ============================================================
// Modals (action sheet, input)
// ============================================================
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
function showModalContent(html){
  document.getElementById("modalsheet").innerHTML = html;
  document.getElementById("modal").classList.add("on");
}
function showActionSheet(items){
  const html = `<div style="display:grid;gap:8px">
    ${items.map((it, i) => `<button class="btn ${it.danger?'btn-danger-ghost':'btn-ghost'}" data-action="modal-action" data-i="${i}">${esc(it.label)}</button>`).join("")}
    <button class="btn btn-soft" data-action="modal-close">Cancel</button>
  </div>`;
  showModalContent(html);
  document.getElementById("modalsheet").addEventListener("click", function handler(e){
    const b = e.target.closest("[data-action='modal-action']");
    if (!b) return;
    const i = parseInt(b.dataset.i);
    closeModal();
    if (items[i].action) items[i].action();
  }, { once: true });
}
function showInputModal(title, initial, onSave, multiline){
  const html = `<h3 class="modalh">${esc(title)}</h3>
    <div class="field">${multiline?`<textarea rows="5" id="inp">${esc(initial||'')}</textarea>`:`<input type="text" id="inp" value="${esc(initial||'')}">`}</div>
    <div class="btn-row split"><button class="btn btn-soft" data-action="modal-close">Cancel</button><button class="btn btn-primary" id="msave">${ICO.check}<span>Save</span></button></div>`;
  showModalContent(html);
  setTimeout(() => document.getElementById("inp")?.focus(), 50);
  document.getElementById("msave").addEventListener("click", () => {
    const v = document.getElementById("inp").value;
    closeModal();
    onSave(v);
  });
}
function showAdHocExerciseModal(){
  const html = `<h3 class="modalh">Add exercise</h3>
    <div class="field"><label>Name</label><input type="text" id="ah-name" placeholder="e.g., Lateral Raise"></div>
    <div class="field" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div><label>Sets</label><input type="number" inputmode="numeric" id="ah-sets" value="3"></div><div><label>Reps</label><input type="number" inputmode="numeric" id="ah-reps" value="10"></div><div><label>Weight (${State.units})</label><input type="number" inputmode="decimal" id="ah-weight" placeholder="—"></div></div>
    <div class="btn-row split"><button class="btn btn-soft" data-action="modal-close">Cancel</button><button class="btn btn-primary" id="ah-save">${ICO.plus}<span>Add</span></button></div>`;
  showModalContent(html);
  setTimeout(() => document.getElementById("ah-name")?.focus(), 50);
  document.getElementById("ah-save").addEventListener("click", () => {
    const name = document.getElementById("ah-name").value.trim();
    const sets = parseInt(document.getElementById("ah-sets").value);
    const reps = parseInt(document.getElementById("ah-reps").value);
    const w = parseFloat(document.getElementById("ah-weight").value);
    if (!name || !sets){ showToast("Name and sets required"); return; }
    const sess = ensureActiveSession();
    sess.adhocExercises = sess.adhocExercises || [];
    sess.adhocExercises.push({
      name, sets, reps,
      intensity: Number.isFinite(w) ? { weight: w, units: State.units } : { bodyweight: true }
    });
    State.saveState();
    closeModal();
    render();
    showToast(`Added ${name}`);
  });
}
function editSessionNotePrompt(){
  const sess = ensureActiveSession();
  if (!sess) return;
  showInputModal("Session note", sess.notes || "", (v) => {
    sess.notes = v; State.saveState(); showToast("Note saved");
  }, true);
}
async function skipSession(){
  if (!confirm("Skip today's session? It will be marked skipped on the calendar.")) return;
  const p = State.activeProgram();
  const day = State.todaysDay();
  const session = {
    id: uuid(), programId: p.id, programWeek: p.cursor.week, programDay: day?.day || null,
    date: todayISO(), status: "skipped",
    startedAt: new Date().toISOString(), endedAt: new Date().toISOString(), notes: ""
  };
  await dbPut("sessions", session);
  State.sessions.push(session);
  // Advance cursor
  const wks = p.json.weeks;
  if (p.cursor.dayIndex < (wks[p.cursor.week-1]?.days?.length||0)-1) p.cursor.dayIndex++;
  else if (p.cursor.week < wks.length){ p.cursor.week++; p.cursor.dayIndex = 0; }
  else p.status = "completed";
  await dbPut("programs", p);
  State.activeSession = null;
  await State.saveState();
  showToast("Session skipped");
  navigate({ name: "today" });
}

// Backdrop close
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

// ============================================================
// Init
// ============================================================
async function init(){
  await openDB();
  await State.load();
  if (State.programs.length === 0){
    await preloadSample();
  }
  if (!State.activeProgramId && State.programs[0]){
    State.activeProgramId = State.programs[0].id;
    await State.saveState();
  }
  // Initial view: Today if there's an active program, else Library
  State.view = State.activeProgramId ? { name: "today" } : { name: "library" };
  render();
  // Register service worker (only over https / localhost)
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    try { await navigator.serviceWorker.register("./sw.js"); } catch(e){ console.warn("SW failed", e); }
  }
}
init().catch(err => {
  document.getElementById("app").innerHTML = `<main class="scr"><div class="empty"><div class="h3">Error starting app</div><pre style="text-align:left;font-size:11px;color:var(--ink-3);overflow:auto">${esc(err.stack || err.message)}</pre></div></main>`;
});
